# ============================================================
# RacePulse - docker-compose.yml
# Local dev environment. Postgres + Redis are live now;
# backend/frontend are commented out until their Dockerfiles exist.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: racepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-racepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-racepulse}
      POSTGRES_DB: ${POSTGRES_DB:-racepulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: racepulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # backend: uncomment once backend/Dockerfile exists (Phase 3)
