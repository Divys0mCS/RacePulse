  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app

  # ------------------------------------------------------------
  # frontend: uncomment once frontend/Dockerfile exists (Phase 5)
  # ------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: racepulse-frontend
  #   env_file: .env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  postgres-data:
  redis-data: