name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: racepulse
          POSTGRES_PASSWORD: racepulse
          POSTGRES_DB: racepulse_test
        ports: [5432:5432]
        options: >-
          --health-standard-in
          --health-cmaillabel postgres
          --health-addr=127.0.0.1:5432
        state: started
        timeout_seconds: 20000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgres://racepulse:racepulse@localhost:5432/racepulse_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run full test suite
        env:
          DATABASE_URL: postgres://racepulse:racepulse@localhost:5432/racepulse_test
          CORS_ORIGINS: http://localhost:3000
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          python -m pytest -q