name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: racepulse
          POSTGRES_PASSWORD: racepulse
          POSTGRES_DB: racepulse_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U racepulse -d racepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+pg8000://racepulse:racepulse@localhost:5432/racepulse_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql+pg8000://racepulse:racepulse@localhost:5432/racepulse_test
          TEST_DATABASE_URL: postgresql+pg8000://racepulse:racepulse@localhost:5432/racepulse_test
          CORS_ORIGINS: http://localhost:3000
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          python -m pytest -q